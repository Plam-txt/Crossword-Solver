<html>
<head>
    <meta charset="UTF-8">
    <title>Crossword Solver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+Hebrew:wght@100..400&display=swap" rel="stylesheet">
</head>
<body>
    <h1 style="text-align: center; font-family: 'Playwrite Hebrew', cursive;">Crossword Solver</h1>
    
    <input type="text" id="rowInput" placeholder="Set the row size #default 5" style="font-family: 'Playwrite Hebrew', cursive;">
    <button id="setRowButton" style="font-family: 'Playwrite Hebrew', cursive;">Set</button>
    <br>
    
    <div id="crosswordContainer" style="margin-top: 20px; font-family: 'Playwrite Hebrew', cursive; font-optical-sizing: auto; font-weight: 400; font-style: normal;">
        <input style="width: 500px; text-align: center; border: 1px solid #ccc; display: block; margin-bottom: 10px; font-family: 'Playwrite Hebrew', cursive;" type="text" placeholder="Enter letter in row 1 a,b,c,d,e">
        <input style="width: 500px; text-align: center; border: 1px solid #ccc; display: block; margin-bottom: 10px; font-family: 'Playwrite Hebrew', cursive;" type="text" placeholder="Enter letter in row 2 a,b,c,d,e">
        <input style="width: 500px; text-align: center; border: 1px solid #ccc; display: block; margin-bottom: 10px; font-family: 'Playwrite Hebrew', cursive;" type="text" placeholder="Enter letter in row 3 a,b,c,d,e">
        <input style="width: 500px; text-align: center; border: 1px solid #ccc; display: block; margin-bottom: 10px; font-family: 'Playwrite Hebrew', cursive;" type="text" placeholder="Enter letter in row 4 a,b,c,d,e">
        <input style="width: 500px; text-align: center; border: 1px solid #ccc; display: block; margin-bottom: 10px; font-family: 'Playwrite Hebrew', cursive;" type="text" placeholder="Enter letter in row 5 a,b,c,d,e">
    </div>
    <br>
    
    <input type="text" id="target" placeholder="place target word you want to check" style="width: 255px; font-family: 'Playwrite Hebrew', cursive; font-optical-sizing: auto; font-weight: 400; font-style: normal;">
    <br>
    <br>
    <button id="solveButton" style="font-family: 'Playwrite Hebrew', cursive;">Solve</button>
    <br>
    
    <div id="output" style="margin-top: 20px; background-color: #f0f0f0; padding: 10px; text-align: center; font-family: 'Playwrite Hebrew', cursive; font-optical-sizing: auto; font-weight: 400; font-style: normal;">
        <br>
        <p id="outputText">Output will be displayed here.</p>
        <br>
    </div>

    <script src="index.js"></script>
</body>
</html>
